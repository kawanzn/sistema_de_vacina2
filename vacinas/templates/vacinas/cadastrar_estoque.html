{% extends 'vacinas/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="content-card shadow-lg">
            <div class="d-flex align-items-center mb-4">
                <a href="{% url 'listar_estoque' %}" class="btn btn-light rounded-circle me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h3 class="fw-bold mb-0">Registrar Entrada de Lote</h3>
            </div>
            
            <form method="POST" data-offline-sync="estoque">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome_vacina" class="form-label fw-bold">Imunizante (Vacina)</label>
                        <input type="text" name="nome_vacina" id="nome_vacina" class="form-control" required placeholder="Nome da vacina">
                    </div>
                    <div class="col-md-6">
                        <label for="lote" class="form-label fw-bold">Número do Lote</label>
                        <input type="text" name="lote" id="lote" class="form-control" required placeholder="Número do lote">
                    </div>
                    <div class="col-md-4">
                        <label for="quantidade_atual" class="form-label fw-bold">Quantidade de Doses</label>
                        <input type="number" name="quantidade_atual" id="quantidade_atual" class="form-control" min="1" required placeholder="0">
                    </div>
                    <div class="col-md-4">
                        <label for="data_validade" class="form-label fw-bold">Data de Validade</label>
                        <input type="date" name="data_validade" id="data_validade" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="fornecedor" class="form-label fw-bold">Fornecedor</label>
                        <input type="text" name="fornecedor" id="fornecedor" class="form-control" placeholder="Nome do fornecedor">
                    </div>
                    <div class="col-md-12">
                        <label for="posto" class="form-label fw-bold">Unidade / Posto</label>
                        <input type="text" name="posto" id="posto" class="form-control" placeholder="Nome do posto ou unidade">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow">
                        Confirmar Entrada no Estoque
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
